<script>
/**
 * 화면 계산 함수 모음. DOM(화면 요소)을 건드리지 않는 순수 함수만 둔다.
 * Node 테스트(app/tests/run.js)가 이 파일의 <script> 안을 읽어 검사한다.
 * 날짜는 'yyyy-MM-dd' 글자로 다룬다.
 */
var WEEKDAY = ['일', '월', '화', '수', '목', '금', '토'];

/* ---------- 글자 ---------- */

/** HTML 특수문자를 무력화한다. 서버에서 온 값을 화면에 넣을 때는 반드시 이걸 거친다. */
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function digits(s) { return String(s == null ? '' : s).replace(/\D/g, ''); }

/* ---------- 날짜 ---------- */

function p2(n) { return (n < 10 ? '0' : '') + n; }
function parseYmd(s) {
  var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s == null ? '' : s));
  return m ? Date.UTC(+m[1], +m[2] - 1, +m[3]) : NaN;
}
/** a - b (일 수) */
function diffDays(a, b) { return Math.round((parseYmd(a) - parseYmd(b)) / 864e5); }
function addDays(s, n) {
  var t = new Date(parseYmd(s) + n * 864e5);
  return t.getUTCFullYear() + '-' + p2(t.getUTCMonth() + 1) + '-' + p2(t.getUTCDate());
}
/** '10/6(화)' */
function fmtMD(s) {
  var t = new Date(parseYmd(s));
  if (isNaN(t.getTime())) return '';
  return (t.getUTCMonth() + 1) + '/' + t.getUTCDate() + '(' + WEEKDAY[t.getUTCDay()] + ')';
}
/** '10/6(화) – 8(목)', 달이 다르면 '10/30(금) – 11/1(일)' */
function fmtRange(start, end) {
  var a = new Date(parseYmd(start)), b = new Date(parseYmd(end));
  if (isNaN(a.getTime()) || isNaN(b.getTime())) return '';
  var same = a.getUTCMonth() === b.getUTCMonth();
  return fmtMD(start) + ' – ' + (same ? b.getUTCDate() + '(' + WEEKDAY[b.getUTCDay()] + ')' : fmtMD(end));
}

/* ---------- 회차 ---------- */

/** days: 시작까지 남은 날(음수면 이미 시작), done: 종료됨, ongoing: 진행 중 */
function sessionState(s, today) {
  var days = diffDays(s.start, today);
  var done = diffDays(s.end, today) < 0;
  return { days: days, done: done, ongoing: !done && days <= 0, started: days <= 0 };
}
/** 환불 가능 마지막 날 = 시작일 - refundDays */
function refundDeadline(s, refundDays) { return addDays(s.start, -refundDays); }

/** 진행 예정 회차는 가까운 순, 종료된 회차는 최근 순 */
function sortSessions(list, today) {
  var up = list.filter(function (s) { return !sessionState(s, today).done; }).sort(function (a, b) { return a.start < b.start ? -1 : a.start > b.start ? 1 : 0; });
  var done = list.filter(function (s) { return sessionState(s, today).done; }).sort(function (a, b) { return a.start < b.start ? 1 : a.start > b.start ? -1 : 0; });
  return up.concat(done);
}
/** 프로그램 안에서 다음 회차 번호 */
function nextSessionNumber(sessions, programId) {
  var max = 0;
  sessions.forEach(function (s) { if (s.program_id === programId && Number(s.n) > max) max = Number(s.n); });
  return max + 1;
}

/* ---------- 참여 기록 ---------- */

function isCancelled(e) { return !!(e && e.cancel_reason); }
function activeOf(enrollments, sid) {
  return enrollments.filter(function (e) { return e.session_id === sid && !isCancelled(e); });
}
function cancelledOf(enrollments, sid) {
  return enrollments.filter(function (e) { return e.session_id === sid && isCancelled(e); });
}
var STEP_COLS = { m1: 'm1_at', pay: 'pay_at', ins: 'ins_at', m2: 'm2_at', sat: 'sat_at' };
/** 단계 완료 여부. 참석은 '참석'일 때만 완료 */
function stepDone(e, key) { return key === 'attend' ? e.attend === '참석' : !!e[STEP_COLS[key]]; }
function countDone(list, key) { return list.filter(function (e) { return stepDone(e, key); }).length; }
/** 참석 칸을 누를 때마다 빈칸 → 참석 → 불참 → 빈칸 */
function nextAttend(cur) { return (cur == null || cur === '') ? '참석' : cur === '참석' ? '불참' : ''; }

/** 이동수단별 인원. exp(고속터미널)·int(시외터미널)는 운영진이 픽업해야 하는 사람 */
function pickupCounts(list) {
  var c = { car: 0, exp: 0, int: 0, blank: 0 };
  list.forEach(function (e) {
    if (e.transport === '자차') c.car++;
    else if (e.transport === '고속터미널') c.exp++;
    else if (e.transport === '시외터미널') c.int++;
    else c.blank++;
  });
  c.pickup = c.exp + c.int;
  return c;
}

function consentLabel(v) { return v === 'Y' ? '동의' : v === 'N' ? '미동의' : '미확인'; }

/** 한 사람의 참여 이력 (최근 회차 순) */
function historyOf(boot, personId) {
  var byId = {}; boot.sessions.forEach(function (s) { byId[s.session_id] = s; });
  return boot.enrollments
    .filter(function (e) { return e.person_id === personId; })
    .map(function (e) { return { enr: e, session: byId[e.session_id] || null }; })
    .sort(function (a, b) { return ((b.session && b.session.start) || '') < ((a.session && a.session.start) || '') ? -1 : 1; });
}

/* ---------- 홈 대시보드 ---------- */

/**
 * 요약 카드 계산. 해당하는 회차가 없으면 null.
 *  upcoming: 2주 안에 시작하는 회차의 참여 인원 / pay: 3주 안 회차의 입금 / ins: 2주 안 회차의 보험
 *  attend: 종료된 회차의 참석 정리(참석 또는 불참이 입력된 사람) 비율
 */
function dashKpi(boot) {
  var today = boot.today, out = { upcoming: null, pay: null, ins: null, attend: null };
  var sum = function (sessions, fn) {
    var total = 0, done = 0;
    sessions.forEach(function (s) { var a = activeOf(boot.enrollments, s.session_id); total += a.length; done += fn(a); });
    return { done: done, total: total };
  };
  var notDone = boot.sessions.filter(function (s) { return !sessionState(s, today).done; });
  var within = function (n) { return notDone.filter(function (s) { return sessionState(s, today).days <= n; }); };

  var w2 = within(14);
  if (w2.length) out.upcoming = { people: sum(w2, function () { return 0; }).total, sessions: w2.length };
  var w3 = within(21);
  if (w3.length) { var p = sum(w3, function (a) { return countDone(a, 'pay'); }); if (p.total) out.pay = p; }
  if (w2.length) { var i = sum(w2, function (a) { return countDone(a, 'ins'); }); if (i.total) out.ins = i; }
  var ended = boot.sessions.filter(function (s) { return sessionState(s, today).done; });
  if (ended.length) {
    var at = sum(ended, function (a) { return a.filter(function (e) { return e.attend === '참석' || e.attend === '불참'; }).length; });
    if (at.total) out.attend = at;
  }
  return out;
}

/**
 * 만족도 응답률. 시작한 회차에서 "참석"으로 정리된 사람(취소 제외)을 분모로, 응답을 표시한 사람을 분자로 센다.
 * (미정·불참은 분모에 넣지 않는다.) 해당하는 사람이 없으면 null.
 */
function satKpi(boot) {
  var today = boot.today, total = 0, done = 0;
  boot.sessions.forEach(function (s) {
    if (!sessionState(s, today).started) return;
    activeOf(boot.enrollments, s.session_id).forEach(function (e) {
      if (e.attend !== '참석') return;
      total++; if (e.sat_at) done++;
    });
  });
  return total ? { done: done, total: total } : null;
}

/* ---------- 문자·메일 발송 준비 (서버 Lib.gs 의 messageTargets 와 같은 규칙) ---------- */

var STAGE_INFO = {
  m1: { name: '1차 안내', filter: 'nom1', ch: 'mail' },
  pay: { name: '입금 요청', filter: 'unpaid', ch: 'sms' },
  m2: { name: '최종 안내', filter: 'nom2', ch: 'sms' },
  sat: { name: '만족도 요청', filter: 'nosat', ch: 'sms' },
  etc: { name: '기타', filter: 'all', ch: 'sms' }
};
var FILTER_TEXT = { all: '확정 인원 전체', unpaid: '입금 미완료', uninsured: '보험 미가입', nom1: '1차 안내 미발송', nom2: '최종 안내 미발송', nosat: '만족도 미응답 (참석자 중)' };
var PROG_LABEL = { all: '공통', w: '일해보기', l: '살아보기', g: '자라보기' };
var CHANNEL_LABEL = { sms: '문자', mail: '메일' };

/** 발송 대상: 그 회차의 합격 · 취소 아님인 참여 기록 중 조건에 맞는 것 */
function messageTargets(enrollments, sid, filter) {
  return enrollments.filter(function (e) {
    if (e.session_id !== sid || isCancelled(e) || e.pass === '불합격') return false;
    switch (filter) {
      case 'all': return true;
      case 'unpaid': return !e.pay_at;
      case 'uninsured': return !e.ins_at;
      case 'nom1': return !e.m1_at;
      case 'nom2': return !e.m2_at;
      case 'nosat': return e.attend === '참석' && !e.sat_at;
      default: return false;
    }
  });
}

/**
 * 문구의 자리표시자를 채운다. ctx: { name, program, n, start, end, fee, refundDeadline, transport, formUrl }
 * 채울 값이 없는 자리표시자({폼링크} 링크가 비었을 때 등)는 그대로 두고 missing 에 이름을 모아 돌려준다.
 */
function fillTemplate(body, ctx) {
  var missing = [];
  var rep = function (text, key, value) {
    if (text.indexOf('{' + key + '}') < 0) return text;
    if (value === '' || value == null) { if (missing.indexOf(key) < 0) missing.push(key); return text; }
    return text.split('{' + key + '}').join(String(value));
  };
  var t = String(body == null ? '' : body);
  t = rep(t, '이름', ctx.name);
  t = rep(t, '프로그램', ctx.program);
  t = rep(t, '회차', ctx.n !== '' && ctx.n != null ? ctx.n + '회차' : '');
  t = rep(t, '날짜', ctx.start ? fmtRange(ctx.start, ctx.end || ctx.start) : '');
  t = rep(t, '참가비', ctx.fee === '' || ctx.fee == null ? '' : Number(ctx.fee).toLocaleString());
  t = rep(t, '환불기한', ctx.refundDeadline ? fmtMD(ctx.refundDeadline) : '');
  t = rep(t, '이동수단', ctx.transport || '미정');
  t = rep(t, '폼링크', ctx.formUrl);
  return { text: t, missing: missing };
}

/** 저장한 문구 중 단계·프로그램에 맞는 것 하나: 그 프로그램 전용(가장 최근) → 공통(가장 최근) → 없음 */
function pickSavedTemplate(templates, stage, programId) {
  var byTime = function (a, b) { return String(a.saved_at) < String(b.saved_at) ? -1 : (String(a.saved_at) > String(b.saved_at) ? 1 : 0); };
  var L = templates.filter(function (x) { return x.stage === stage; }).sort(byTime);
  return L.filter(function (x) { return x.program_id === programId; }).slice(-1)[0] || L.filter(function (x) { return x.program_id === 'all'; }).slice(-1)[0] || null;
}

/** 저장한 문구 목록의 보기 조건. libStage: 'cur' | 'every' | 단계 / libProg: 'cur' | 'every' | 프로그램 | 'all' */
function filterLibrary(templates, curStage, curProg, libStage, libProg) {
  return templates.filter(function (x) {
    var okS = libStage === 'every' || x.stage === (libStage === 'cur' ? curStage : libStage);
    var okP = libProg === 'every' || (libProg === 'cur' ? (x.program_id === curProg || x.program_id === 'all') : x.program_id === libProg);
    return okS && okP;
  });
}

/** 문자 종류: 한글 2바이트·그 밖 1바이트로 세어 90바이트를 넘으면 장문(LMS) */
function smsBytes(text) {
  var n = 0, s = String(text == null ? '' : text);
  for (var i = 0; i < s.length; i++) n += s.charCodeAt(i) > 127 ? 2 : 1;
  return n;
}
function smsKind(text) { return smsBytes(text) > 90 ? 'LMS' : 'SMS'; }

/* ---------- 이관: 주민번호 보호 ---------- */

/** 서버의 looksLikeRrn 과 같은 규칙 (app/tests/run.js 가 두 코드가 같은 결과를 내는지 비교한다) */
var RRN_RE = /(?<!\d)\d{6}\s*-\s*[1-8]\d{6}(?!\d)|(?<!\d)\d{6}[1-8]\d{6}(?!\d)/;
function looksLikeRrn(s) { return RRN_RE.test(String(s == null ? '' : s)); }

/**
 * 엑셀 행에서 "주민번호"가 적힌 열을 통째로 비운다. 주민번호는 브라우저를 떠나지 않는다.
 * 반환: { rows: 비운 뒤의 행, count: 비운 열 수 }
 */
function blankRrnColumns(rows) {
  var cols = {};
  rows.forEach(function (r) {
    (r || []).forEach(function (c, i) {
      var t = String(c == null ? '' : c).trim();
      if (t.length <= 30 && t.indexOf('주민번호') >= 0) cols[i] = true;
    });
  });
  return {
    count: Object.keys(cols).length,
    rows: rows.map(function (r) { return (r || []).map(function (c, i) { return cols[i] ? '' : c; }); })
  };
}

/** 어느 칸이든 주민번호 모양이면 true (이 경우 전송하지 않고 중단한다) */
function rowsHaveRrn(rows) {
  return rows.some(function (r) { return (r || []).some(function (c) { return looksLikeRrn(c); }); });
}

/** 뒤쪽의 빈 행을 잘라낸다 */
function trimRows(rows) {
  var last = -1;
  rows.forEach(function (r, i) { if ((r || []).some(function (c) { return String(c == null ? '' : c).trim() !== ''; })) last = i; });
  return rows.slice(0, last + 1);
}

/* ---------- 2단계: 주민번호 (서버 Lib.gs 의 validateRrn·rrnMatchesProfile 과 같은 규칙) ---------- */

/** 사유 코드의 한글 설명. 값은 담지 않는다. */
var RRN_CODE_LABELS = {
  EMPTY: '비어 있어요', LENGTH: '자릿수가 맞지 않아요', BIRTHDATE: '생년월일이 올바르지 않아요', GENDER_DIGIT: '성별 자리가 올바르지 않아요',
  BIRTH_MISMATCH: '출생연도가 신청서와 달라요', GENDER_MISMATCH: '성별이 신청서와 달라요'
};

function isRealYmd(y, m, d) {
  var t = new Date(Date.UTC(y, m - 1, d));
  return t.getUTCFullYear() === y && t.getUTCMonth() === m - 1 && t.getUTCDate() === d;
}

/** 형식 검사 (13자리, 실제 있는 생년월일, 성별 자리 1~8, 체크섬 없음). 통과하면 하이픈 형태로 정리 */
function validateRrn(raw) {
  var d, restored = false;
  if (typeof raw === 'number' && isFinite(raw)) {
    d = String(Math.round(raw));
    if (d.length === 12) { d = '0' + d; restored = true; }   // 숫자 칸이라 앞의 0이 지워진 경우
  } else {
    d = digits(raw);
  }
  if (!d) return { ok: false, code: 'EMPTY' };
  if (d.length !== 13) return { ok: false, code: 'LENGTH' };
  var g = +d.charAt(6);
  if (g < 1 || g > 8) return { ok: false, code: 'GENDER_DIGIT' };
  var century = (g === 1 || g === 2 || g === 5 || g === 6) ? 1900 : 2000;
  var year = century + (+d.slice(0, 2));
  if (!isRealYmd(year, +d.slice(2, 4), +d.slice(4, 6))) return { ok: false, code: 'BIRTHDATE' };
  return { ok: true, code: 'OK', rrn: d.slice(0, 6) + '-' + d.slice(6), birthYear: year, male: g % 2 === 1, restored: restored };
}

/** 신청서의 성별·출생연도와 번호를 대조한다 */
function rrnMatchesProfile(raw, gender, birthYear) {
  var v = validateRrn(raw);
  if (!v.ok) return { ok: false, code: v.code, codes: [v.code] };
  var codes = [], by = parseInt(birthYear, 10);
  if (by && by !== v.birthYear) codes.push('BIRTH_MISMATCH');
  if ((gender === '남' || gender === '여') && ((gender === '남') !== v.male)) codes.push('GENDER_MISMATCH');
  return codes.length ? { ok: false, code: codes[0], codes: codes } : { ok: true, code: 'OK', codes: [] };
}

/**
 * 신청 엑셀에서 주민번호 열을 떼어낸다. 머리글 행(이름 또는 신청자명 칸이 있는 행)에서 "주민번호"가 들어간 열만 찾는다.
 * (데이터 칸의 글자는 보지 않으므로 남긴 말에 "주민번호"라는 말이 있어도 열로 오해하지 않는다)
 * 반환: { rows: 주민번호 열을 비운 행(행 번호·배열 순서 그대로), rrns: [{ rowNo, raw }], count: 찾은 열 수 }
 *  - rrns 는 브라우저 메모리에서만 쓰고 화면·저장소에 두지 않는다. 쓰고 나면 버린다.
 */
function splitRrnColumn(rows) {
  var cols = {}, headerRows = {};
  rows.forEach(function (r, i) {
    var cells = (r || []).map(function (c) { return String(c == null ? '' : c).replace(/^﻿/, '').trim(); });
    if (cells.indexOf('이름') >= 0 || cells.indexOf('신청자명') >= 0) {
      headerRows[i] = true;
      cells.forEach(function (t, j) { if (t.length <= 80 && t.indexOf('주민번호') >= 0) cols[j] = true; });
    }
  });
  var rrns = [];
  var blanked = rows.map(function (r, i) {
    var row = (r || []).slice();
    if (!headerRows[i]) {
      Object.keys(cols).forEach(function (j) {
        var v = row[+j];
        if (v != null && String(v).trim() !== '') rrns.push({ rowNo: i + 1, raw: v });
      });
    }
    Object.keys(cols).forEach(function (j) { if (+j < row.length) row[+j] = ''; });
    return row;
  });
  return { rows: blanked, rrns: rrns, count: Object.keys(cols).length };
}

/**
 * 업로드 화면에서 번호 한 건을 분류한다.
 *  empty 비어 있음 / invalid 형식 오류(자릿수·생년월일·성별 자리) / mismatch 형식은 맞지만 신청서의 성별·출생연도와 다름 / ok 정상
 * 반환: { state, code, codes }  (값은 담지 않는다)
 */
function classifyRrn(raw, gender, birthYear) {
  if (raw == null || String(raw).trim() === '') return { state: 'empty', code: 'EMPTY', codes: ['EMPTY'] };
  var m = rrnMatchesProfile(raw, gender, birthYear);
  if (m.ok) return { state: 'ok', code: 'OK', codes: [] };
  var c0 = m.codes[0];
  if (c0 === 'BIRTH_MISMATCH' || c0 === 'GENDER_MISMATCH') return { state: 'mismatch', code: c0, codes: m.codes };
  return { state: 'invalid', code: c0, codes: m.codes };
}
function rrnCodeText(codes) { return (codes || []).map(function (c) { return RRN_CODE_LABELS[c] || '확인이 필요해요'; }).join(', '); }

/**
 * 등록 요청에 실을 주민번호 목록을 만든다.
 * rows: 미리보기 행(rowNo, rrnEligible, gender, birth_year) / mem: { 행번호: 파일에서 읽은 값 } / inputs: { 행번호: { rrn(화면에서 고쳐 입력한 값), confirm(그대로 저장) } }
 * 정상은 싣고, 신청서와 다른 번호는 "그대로 저장"을 고른 것만 싣는다. 형식 오류·빈칸은 싣지 않는다 (등록 뒤 앱에서 입력).
 * 반환: { items:[{rowNo, rrn, confirmMismatch}], counts:{ ok, forced, mismatch, invalid, empty } } — counts 에는 값이 없다.
 */
function buildRrnPayload(rows, mem, inputs) {
  var items = [], c = { ok: 0, forced: 0, mismatch: 0, invalid: 0, empty: 0 };
  rows.forEach(function (r) {
    if (!r.rrnEligible) return;
    var inp = (inputs && inputs[r.rowNo]) || {};
    var raw = inp.rrn !== undefined && inp.rrn !== null && inp.rrn !== '' ? inp.rrn : (mem ? mem[r.rowNo] : undefined);
    var k = classifyRrn(raw, r.gender, r.birth_year);
    if (k.state === 'ok') { items.push({ rowNo: r.rowNo, rrn: raw, confirmMismatch: false }); c.ok++; }
    else if (k.state === 'mismatch' && inp.confirm) { items.push({ rowNo: r.rowNo, rrn: raw, confirmMismatch: true }); c.forced++; }
    else c[k.state]++;
  });
  return { items: items, counts: c };
}

/** 미리보기 판정의 한글 이름과 칩 색 */
var DECISION_TEXT = {
  new: ['신규', 'ok'], existing: ['이미 등록됨 · 빈 칸 보충', 'pri'], rejected: ['불합격 · 제외', ''], cancelled_new: ['취소 상태로 등록', 'warn'],
  needs_session: ['회차 확인 필요', 'bad'], duplicate_in_file: ['파일 안 중복 · 제외', ''], error: ['읽을 수 없음', 'bad']
};
/** 열 이름(영문)을 사람이 읽는 말로 */
var FILL_LABELS = { job: '직업', area: '거주지', email: '이메일', gender: '성별', birth_year: '출생연도', consent_retain: '추가 보유 동의', consent_portrait: '초상권 동의',
  applied_at: '신청일', hp_no: '홈페이지 번호', notice_ack: '안내 확인', memo: '남긴 말', attend: '참석 여부' };

/* ---------- 2단계: 할 일 (F3) ---------- */

var TODO_KIND_RANK = { rrn: 0, ins: 1, pay: 2, refund: 3, m1: 4, attend: 5, sat: 6 };
var TODO_SEV_RANK = { bad: 0, warn: 1, pri: 2 };

/**
 * 해야 할 일 목록. 화면이 문장으로 바꾼다.
 * 항목: { kind, sev(bad|warn|pri), n(인원), sid, days(시작까지 남은 날. 종료된 회차는 음수) }
 *  rrn 주민번호 없음·확인 필요 / ins 보험 미가입 / pay 입금 미확인 / refund 환불 기한 임박 / m1 1차 안내 미발송 /
 *  attend 종료 후 참석 정리 / sat 만족도 미응답 (참석자 중)
 * boot.rrnStatus({참여기록ID: ok|missing|check})가 없으면 주민번호 항목은 만들지 않는다.
 */
/** 할 일 한 줄의 제목 (n: 인원) */
function todoTitle(kind, n) {
  switch (kind) {
    case 'rrn': return '주민번호 없음·확인 필요 ' + n + '명';
    case 'ins': return '여행자보험 미가입 ' + n + '명';
    case 'pay': return '참가비 입금 미확인 ' + n + '명';
    case 'refund': return '전액 환불 기한이 곧 끝나요 (참여 ' + n + '명)';
    case 'm1': return '1차 안내 미발송 ' + n + '명';
    case 'attend': return '참석 여부 입력 필요 ' + n + '명';
    case 'sat': return '만족도 응답 표시 필요 ' + n + '명';
    default: return String(kind);
  }
}
/** 사이드바 배지: 긴급(빨강) 할 일 항목 수 */
function urgentTodoCount(boot) { return todoList(boot).filter(function (t) { return t.sev === 'bad'; }).length; }

function todoList(boot) {
  var t = boot.today, out = [], refundDays = boot.config.refund_days;
  var rs = boot.rrnStatus || null;
  boot.sessions.forEach(function (s) {
    var st = sessionState(s, t), A = activeOf(boot.enrollments, s.session_id);
    var add = function (kind, sev, n) { if (n > 0) out.push({ kind: kind, sev: sev, n: n, sid: s.session_id, days: st.days }); };
    if (!st.done) {
      if (rs && st.days <= 14) add('rrn', st.days <= 7 ? 'bad' : 'warn', A.filter(function (e) { return e.pass !== '불합격' && !stepDone(e, 'ins') && rs[e.enroll_id] !== 'ok'; }).length);   // 보험 가입을 마치면 번호는 지워지므로 더 필요 없다
      if (st.days <= 7) add('ins', st.days <= 3 ? 'bad' : 'warn', A.filter(function (e) { return !stepDone(e, 'ins'); }).length);
      if (st.days <= 10) add('pay', st.days <= 3 ? 'bad' : 'warn', A.filter(function (e) { return !stepDone(e, 'pay'); }).length);
      var rdd = diffDays(refundDeadline(s, refundDays), t);
      if (rdd >= 0 && rdd <= 1) add('refund', 'warn', A.length);
      if (st.days <= 21) add('m1', 'warn', A.filter(function (e) { return !stepDone(e, 'm1'); }).length);
    } else {
      var since = diffDays(t, s.end);
      if (since <= 30) add('attend', 'warn', A.filter(function (e) { return !e.attend; }).length);
      if (since <= 14) add('sat', 'pri', A.filter(function (e) { return e.attend === '참석' && 'sat_at' in e && !e.sat_at; }).length);
    }
  });
  return out.sort(function (a, b) {
    return (TODO_SEV_RANK[a.sev] - TODO_SEV_RANK[b.sev]) || (Math.abs(a.days) - Math.abs(b.days)) || (TODO_KIND_RANK[a.kind] - TODO_KIND_RANK[b.kind]);
  });
}
</script>

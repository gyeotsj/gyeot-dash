<script>
/**
 * 화면 그리기와 서버 호출. 계산은 Logic.html, 서버 규칙은 *.gs 에 있다.
 * 규칙: 서버에서 온 모든 값은 esc()를 거쳐서 화면에 넣는다. (이름에 스크립트가 들어 있어도 실행되지 않게)
 */

/* ===================== 아이콘 ===================== */
var IC = {
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>',
  cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  users: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.5a3.5 3.5 0 010 7M18 14.5c2 .6 3.5 2.4 3.5 5.5"/></svg>',
  list: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
  up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 001 1h14a1 1 0 001-1v-3"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  key: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3M14 9l2 2"/></svg>',
  pencil: '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>',
  warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18.5v.01"/></svg>',
  car: '<svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h14M3 13l2-6h14l2 6v4H3z"/><circle cx="7.5" cy="17" r="1.5"/><circle cx="16.5" cy="17" r="1.5"/></svg>',
  chev: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M9 6l6 6-6 6"/></svg>'
};

/* ===================== 상태 ===================== */
var S = {
  boot: null, screen: 'dash', prog: 'all', sid: null, q: '',
  drawer: null,          // { eid }  참여자 상세 패널
  edit: false,           // 참여자 상세 수정 모드
  sf: null,              // 회차 입력 패널 { mode: 'new' | 'edit', sid }
  modal: null,           // { title, html, yes, danger, need }
  pending: {},           // 저장 중인 참여 기록 (같은 행을 연달아 누를 때 충돌 방지)
  busy: false,
  imp: null,             // 이관 화면 상태
  staffList: null        // 운영진 관리 화면 데이터 (소유자 전용)
};
var X = { person: {}, session: {}, prog: {} };
var MODAL_FN = null;

function reindex() {
  X = { person: {}, session: {}, prog: {} };
  S.boot.people.forEach(function (p) { X.person[p.person_id] = p; });
  S.boot.sessions.forEach(function (s) { X.session[s.session_id] = s; });
  S.boot.programs.forEach(function (p) { X.prog[p.program_id] = p; });
}
function progName(id) { return X.prog[id] ? X.prog[id].name : id; }
function progColor(id) { return id === 'l' ? 'var(--c-l)' : id === 'g' ? 'var(--c-g)' : 'var(--c-w)'; }
function isOwner() { return S.boot && S.boot.me.role === 'owner'; }
function enrOf(eid) { return S.boot.enrollments.filter(function (e) { return e.enroll_id === eid; })[0]; }
function replaceIn(list, key, row) {
  for (var i = 0; i < list.length; i++) { if (list[i][key] === row[key]) { list[i] = row; return; } }
  list.push(row);
}
function replaceEnr(row) { replaceIn(S.boot.enrollments, 'enroll_id', row); }
function replacePerson(row) { replaceIn(S.boot.people, 'person_id', row); X.person[row.person_id] = row; }
function replaceSession(row) { replaceIn(S.boot.sessions, 'session_id', row); X.session[row.session_id] = row; }
function defaultSid() {
  var l = sortSessions(S.boot.sessions, S.boot.today);
  return l.length ? l[0].session_id : null;
}

/* ===================== 서버 호출 ===================== */
function parseErr(e) {
  var m = String((e && e.message) || e || '');
  var x = /\[([A-Z_]+)\]\s*([\s\S]*)/.exec(m);
  return { code: x ? x[1] : 'ERROR', msg: x ? x[2].trim() : m.replace(/^(Error|Exception):\s*/, '') };
}
function api(name) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (resolve, reject) {
    var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(function (e) { reject(parseErr(e)); });
    r[name].apply(r, args);
  });
}
function fail(err) {
  toast(err.msg || '저장하지 못했어요');
  if (err.code === 'CONFLICT' || err.code === 'NOT_FOUND') loadBoot();
}
function loadBoot() {
  return api('getBootstrap').then(function (b) {
    S.boot = b; reindex();
    if (!S.sid || !X.session[S.sid]) S.sid = defaultSid();
    render();
  }).catch(function (err) {
    var r = document.getElementById('root');
    r.innerHTML = '<div class="center"><div class="card deny"><div class="icon">!</div><h1>불러오지 못했어요</h1><p>' + esc(err.msg) + '</p>' +
      '<p><button class="btn pri" data-act="reload">다시 불러오기</button></p></div></div>';
  });
}

/* ===================== 작은 도우미 ===================== */
function toast(msg) {
  var el = document.getElementById('toast'); if (!el) return;
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(function () { el.classList.remove('show'); }, 2600);
}
function pct(d, t) { return t ? Math.round(d / t * 100) : 0; }
function money(n) { return n === '' || n == null ? '' : Number(n).toLocaleString() + '원'; }
function pchip(id) { return '<span class="pg"><i style="background:' + progColor(id) + '"></i>' + esc(progName(id)) + '</span>'; }
function stateChip(st) {
  if (st.done) return '<span class="chip">종료</span>';
  if (st.ongoing) return '<span class="chip ok dot">진행 중</span>';
  if (st.days <= 3) return '<span class="chip bad dot">D-' + st.days + '</span>';
  if (st.days <= 10) return '<span class="chip warn dot">D-' + st.days + '</span>';
  return '<span class="chip pri dot">D-' + st.days + '</span>';
}
function mini(list, key, st) {
  var t = list.length, d = countDone(list, key), p = pct(d, t), cls = '';
  if (!st.done && d < t) { if (st.days <= 3) cls = 'bad'; else if (st.days <= 10) cls = 'warn'; }
  return '<div class="mini ' + cls + '"><div class="t"><i style="width:' + p + '%"></i></div><small>' + d + '/' + t + '</small></div>';
}
function personSub(p) {
  var parts = [];
  if (p.job) parts.push(p.job);
  if (p.gender) parts.push(p.gender);
  if (p.birth_year) parts.push(p.birth_year + '년생');
  return parts.map(esc).join(' · ');
}
function transChip(v) { return v ? '<span class="chip ' + (v === '자차' ? '' : 'warn') + '">' + esc(v) + '</span>' : '<span class="chip">미정</span>'; }
function consentChip(label, v) { return '<span class="chip ' + (v === 'Y' ? 'ok' : v === 'N' ? 'bad' : 'warn') + '">' + esc(label) + ' ' + consentLabel(v) + '</span>'; }

/* ===================== 틀 ===================== */
function render() {
  var root = document.getElementById('root'); if (!root) return;
  if (!S.boot) { root.innerHTML = '<div class="loading">불러오는 중…</div>'; return; }
  var y = window.scrollY;
  var screens = { dash: dashHtml, sess: sessHtml, people: peopleHtml, sessions: sessionsHtml, imp: importHtml, staff: staffHtml };
  root.innerHTML = '<div class="app">' + sideHtml() + '<main>' + (screens[S.screen] || dashHtml)() + '</main></div>' + overlayHtml();
  window.scrollTo(0, y);
}

function sideHtml() {
  var items = [['dash', '홈 대시보드', 'home'], ['sess', '회차 상세', 'cal'], ['people', '참여자', 'users'], ['sessions', '회차 관리', 'list']];
  if (isOwner()) { items.push(['imp', '기존 엑셀 이관', 'up']); items.push(['staff', '운영진 관리', 'key']); }
  var me = S.boot.me;
  return '<aside class="side"><div class="brand"><div class="logo">곁</div><div><b>곁마을 운영</b><span>내부 운영진 전용</span></div></div>' +
    '<div class="nav-label">메뉴</div>' +
    items.map(function (x) { return '<button class="nav ' + (S.screen === x[0] ? 'on' : '') + '" data-act="nav" data-to="' + x[0] + '">' + IC[x[2]] + '<span>' + x[1] + '</span></button>'; }).join('') +
    '<div class="side-foot"><b>' + esc(me.name) + '</b> · ' + (me.role === 'owner' ? '소유자' : '운영진') + '<br>' + esc(me.email) + '<br>버전 ' + esc(typeof APP_VERSION === 'undefined' ? '' : APP_VERSION) + '</div></aside>';
}

function overlayHtml() {
  var out = '';
  if (S.drawer) out += drawerHtml();
  if (S.sf) out += sessionFormHtml();
  if (S.modal) out += modalHtml();
  return out;
}

/* ===================== 홈 대시보드 ===================== */
function dashHtml() {
  var b = S.boot, t = b.today, k = dashKpi(b);
  var list = sortSessions(b.sessions.filter(function (s) { return S.prog === 'all' || s.program_id === S.prog; }), t);
  var progs = [['all', '전체']].concat(b.programs.map(function (p) { return [p.program_id, p.name]; }));

  function kpi(label, main, desc, bar) {
    return '<div class="card kpi"><div class="l">' + label + '</div><div class="v">' + main + '</div><div class="d">' + desc + '</div>' +
      (bar != null ? '<div class="bar"><i style="width:' + bar + '%"></i></div>' : '') + '</div>';
  }
  var cards =
    kpi('2주 안에 참여하는 사람', k.upcoming ? k.upcoming.people + '<small>명</small>' : '–', k.upcoming ? k.upcoming.sessions + '개 회차 진행 예정' : '진행 예정 회차가 없어요') +
    kpi('참가비 입금 완료율', k.pay ? pct(k.pay.done, k.pay.total) + '<small>%</small>' : '–', k.pay ? '3주 안 회차 ' + k.pay.done + '/' + k.pay.total + '명' : '3주 안에 시작하는 회차가 없어요', k.pay ? pct(k.pay.done, k.pay.total) : null) +
    kpi('여행자보험 가입률', k.ins ? pct(k.ins.done, k.ins.total) + '<small>%</small>' : '–', k.ins ? '2주 안 회차 ' + k.ins.done + '/' + k.ins.total + '명' : '2주 안에 시작하는 회차가 없어요', k.ins ? pct(k.ins.done, k.ins.total) : null) +
    kpi('종료 회차 참석 정리', k.attend ? pct(k.attend.done, k.attend.total) + '<small>%</small>' : '–', k.attend ? '참석·불참 입력 ' + k.attend.done + '/' + k.attend.total + '명' : '종료된 회차가 없어요', k.attend ? pct(k.attend.done, k.attend.total) : null);

  var rows = list.map(function (s) {
    var st = sessionState(s, t), a = activeOf(b.enrollments, s.session_id), c = cancelledOf(b.enrollments, s.session_id);
    return '<tr class="click" data-act="sess" data-sid="' + esc(s.session_id) + '">' +
      '<td class="nw"><div style="font-weight:700">' + esc(s.n) + '회차</div>' + pchip(s.program_id) + '</td>' +
      '<td class="nw">' + esc(fmtRange(s.start, s.end)) + '</td><td>' + stateChip(st) + '</td>' +
      '<td class="nw"><b>' + a.length + '</b><span class="muted">' + (s.cap ? '/' + esc(s.cap) : '') + '</span>' + (c.length ? ' <span class="tag">취소 ' + c.length + '</span>' : '') + '</td>' +
      '<td>' + mini(a, 'pay', st) + '</td><td>' + mini(a, 'ins', st) + '</td><td>' + mini(a, 'm2', st) + '</td>' +
      '<td>' + (st.started ? mini(a, 'attend', st) : '<span class="muted">–</span>') + '</td></tr>';
  }).join('');

  var table = list.length
    ? '<div class="card"><div class="card-h"><h2>회차 현황</h2><span class="chip">' + list.length + '개</span><div class="sp"></div><span class="muted" style="font-size:12.5px">행을 누르면 회차 상세로 이동</span></div>' +
      '<div class="scroll"><table class="tbl" style="margin-top:12px"><thead><tr><th>회차</th><th>일정</th><th>상태</th><th>참여 인원</th><th>입금</th><th>보험</th><th>최종 안내</th><th>참석</th></tr></thead><tbody>' + rows + '</tbody></table></div></div>'
    : '<div class="card"><div class="empty"><b>아직 회차가 없어요</b>회차를 추가하거나, 기존 엑셀의 명단을 이관해 시작하세요.' +
      '<div class="row"><button class="btn pri" data-act="sf-new">' + IC.plus + ' 회차 추가</button>' + (isOwner() && !b.config.legacy_imported ? '<button class="btn" data-act="nav" data-to="imp">' + IC.up + ' 기존 엑셀 이관</button>' : '') + '</div></div></div>';

  return '<div class="top"><div><h1>홈 대시보드</h1><div class="sub">모집부터 참여까지, 회차가 지금 어디까지 진행됐는지 한눈에 봅니다.</div></div><div class="sp"></div>' +
    '<div class="acts"><div class="seg">' + progs.map(function (p) { return '<button class="' + (S.prog === p[0] ? 'on' : '') + '" data-act="prog" data-id="' + esc(p[0]) + '">' + esc(p[1]) + '</button>'; }).join('') + '</div>' +
    '<button class="btn pri" data-act="sf-new">' + IC.plus + ' 회차 추가</button></div></div>' +
    '<div class="grid g4" style="margin-bottom:16px">' + cards + '</div>' + table;
}

/* ===================== 회차 상세 ===================== */
function sessHtml() {
  var b = S.boot, s = X.session[S.sid];
  if (!s) {
    return '<div class="top"><div><h1>회차 상세</h1></div></div><div class="card"><div class="empty"><b>회차를 선택해 주세요</b>홈 대시보드에서 회차를 누르거나, 회차를 먼저 추가하세요.' +
      '<div class="row"><button class="btn" data-act="nav" data-to="dash">홈으로</button><button class="btn pri" data-act="sf-new">' + IC.plus + ' 회차 추가</button></div></div></div>';
  }
  var t = b.today, st = sessionState(s, t);
  var all = b.enrollments.filter(function (e) { return e.session_id === s.session_id; });
  var act = activeOf(b.enrollments, s.session_id);
  var canc = cancelledOf(b.enrollments, s.session_id);
  var rd = refundDeadline(s, b.config.refund_days), rdd = diffDays(rd, t);
  var pick = pickupCounts(act);
  var sibs = sortSessions(b.sessions.filter(function (x) { return x.program_id === s.program_id; }), t).sort(function (a, c) { return Number(a.n) - Number(c.n); });
  var sorted = act.concat(canc);

  var rdNote = st.done ? '' : ' · 환불 가능 기한 <b style="color:' + (rdd >= 0 && rdd <= 1 ? 'var(--bad)' : 'inherit') + '">' + esc(fmtMD(rd)) + (rdd === 0 ? ' (오늘)' : '') + '</b> <span class="muted">(시작 ' + b.config.refund_days + '일 전까지 100%)</span>';
  var bulk = st.started
    ? '<button class="btn" data-act="bulk" data-v="true">' + IC.check.replace('<svg', '<svg width="15" height="15"') + ' 참석 전원 처리</button><button class="btn" data-act="bulk" data-v="">참석 전원 해제</button>' : '';

  function sum(label, val, small) { return '<div class="card"><div class="l">' + label + '</div><div class="v">' + val + '<small> ' + small + '</small></div></div>'; }
  var cards = '<div class="sum">' +
    sum('참여 인원', act.length, s.cap ? '/ ' + esc(s.cap) + '명' : '명') +
    sum('참가비 입금', countDone(act, 'pay'), '/ ' + act.length) +
    sum('여행자보험', countDone(act, 'ins'), '/ ' + act.length) +
    sum('최종 안내', countDone(act, 'm2'), '/ ' + act.length) +
    '<div class="card"><div class="l">' + IC.car + ' 픽업 필요</div><div class="v" style="color:' + (pick.pickup ? 'var(--warn)' : 'inherit') + '">' + pick.pickup + '<small>명</small></div>' +
    '<div class="pick"><span class="chip">고속터미널 ' + pick.exp + '</span><span class="chip">시외터미널 ' + pick.int + '</span><span class="chip">자차 ' + pick.car + '</span>' + (pick.blank ? '<span class="chip warn">미정 ' + pick.blank + '</span>' : '') + '</div></div></div>';

  function stepBtn(e, key) {
    var on = stepDone(e, key), busy = S.pending[e.enroll_id] ? ' disabled' : '';
    var late = !on && !st.done && st.days <= 3 && (key === 'pay' || key === 'ins');
    return '<button class="sb ' + (on ? 'on' : '') + (late ? ' late' : '') + '" data-act="step" data-eid="' + esc(e.enroll_id) + '" data-step="' + key + '"' + busy + '>' + IC.check + '</button>';
  }
  function attendBtn(e) {
    if (!st.started) return '<span class="dash">–</span>';
    var v = e.attend;
    return '<button class="attend-btn ' + (v === '참석' ? 'on' : v === '불참' ? 'no' : '') + '" data-act="attend" data-eid="' + esc(e.enroll_id) + '"' + (S.pending[e.enroll_id] ? ' disabled' : '') + '>' + (v || '미정') + '</button>';
  }
  var body = sorted.map(function (e) {
    var p = X.person[e.person_id] || { name: '(알 수 없음)', phone: '' };
    var cx = isCancelled(e);
    var nameCell = '<td><div class="name"><div class="av">' + esc((p.name || '?').charAt(0)) + '</div><div><b>' + esc(p.name) + (cx ? ' <span class="chip bad" style="margin-left:4px">취소</span>' : '') + '</b><small>' + personSub(p) + '</small></div></div></td>';
    var trans = '<td data-act="none"><select class="tsel ' + (e.transport && e.transport !== '자차' ? 'warn' : '') + '" data-act="transport" data-eid="' + esc(e.enroll_id) + '"' + (cx || S.pending[e.enroll_id] ? ' disabled' : '') + ' title="이동수단 변경">' +
      ['', '자차', '고속터미널', '시외터미널'].map(function (v) { return '<option value="' + v + '"' + (e.transport === v ? ' selected' : '') + '>' + (v || '미정') + '</option>'; }).join('') + '</select></td>';
    var steps = cx
      ? '<td colspan="6" class="muted">취소 사유: ' + esc(e.cancel_reason) + (e.refund_amount !== '' ? ' · 환불 ' + esc(money(e.refund_amount)) : '') + '</td>'
      : '<td class="c" data-act="none"><span class="sb on fix" title="합격">' + IC.check + '</span></td>' +
        ['m1', 'pay', 'ins', 'm2'].map(function (k) { return '<td class="c" data-act="none">' + stepBtn(e, k) + '</td>'; }).join('') +
        '<td class="c" data-act="none">' + attendBtn(e) + '</td>';
    return '<tr class="click ' + (cx ? 'cx' : '') + '" data-act="who" data-eid="' + esc(e.enroll_id) + '">' + nameCell + '<td class="muted nw">' + esc(p.phone) + '</td>' + trans + steps + '</tr>';
  }).join('');

  return '<div class="crumb"><a data-act="nav" data-to="dash">홈</a> ' + IC.chev + ' <span>' + esc(progName(s.program_id)) + '</span> ' + IC.chev + ' <span>' + esc(s.n) + '회차</span></div>' +

function readImportOpts() {
  var v = function (id) { var el = document.getElementById(id); return el ? el.value : ''; };
  S.imp.opts = { program_id: v('imp-prog') || 'w', year: v('imp-year'), fee: v('imp-fee'), cap: v('imp-cap') };

function onImportFile(file) {
  S.imp = newImp();
  if (!file) { render(); return; }
  S.imp.file = file.name;
  if (typeof XLSX === 'undefined') { S.imp.error = '엑셀 읽기 도구를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.'; render(); return; }
  var rd = new FileReader();
  rd.onload = function () {
    try {
      var wb = XLSX.read(rd.result, { type: 'array' });
      var ws = wb.Sheets[wb.SheetNames[0]];
      var raw = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', raw: true });
      var blanked = blankRrnColumns(raw);                 // 주민번호 열을 통째로 비운다 (이 뒤로 원본 raw는 쓰지 않는다)
      if (rowsHaveRrn(blanked.rows)) {
        S.imp.error = '주민번호처럼 보이는 값이 다른 칸에도 있어서 이관을 중단했어요. 아무것도 전송하지 않았어요. 엑셀의 주민번호 열 이름이 "주민번호"인지 확인해 주세요.';
      } else {
        S.imp.rows = trimRows(blanked.rows); S.imp.rowCount = S.imp.rows.length; S.imp.rrnCols = blanked.count;
        if (!blanked.count) S.imp.error = '주민번호 열을 찾지 못했어요. 값이 모두 비어 있어서 괜찮다면 그대로 진행할 수 있어요.';
      }
    } catch (e) { S.imp.error = '엑셀을 읽지 못했어요: ' + e.message; }
    render();
  };
  rd.onerror = function () { S.imp.error = '파일을 읽지 못했어요.'; render(); };
  rd.readAsArrayBuffer(file);
}
function previewImport() {
  readImportOpts(); S.imp.busy = true; S.imp.preview = null; S.imp.ok = false; render();
  api('previewLegacyImport', { rows: S.imp.rows, opts: S.imp.opts }).then(function (pv) { S.imp.busy = false; S.imp.preview = pv; render(); })
    .catch(function (err) { S.imp.busy = false; S.imp.error = err.msg; render(); });

function commitImport() {
  S.imp.busy = true; render();
  api('commitLegacyImport', { rows: S.imp.rows, opts: S.imp.opts }).then(function (res) {
    S.imp.busy = false; S.imp.result = res; return loadBoot();

function reportShares(prefix, shares) {
  var bad = shares.filter(function (s) { return !s.ok; });
  if (!bad.length) { toast(prefix + ' 파일 공유도 마쳤어요'); return; }
  openModal({
    title: '일부 파일 공유에 실패했어요',
    html: '<p>' + esc(prefix) + ' 아래 파일은 공유하지 못했어요. 목록의 "다시 공유"로 다시 시도하거나, 구글 드라이브에서 직접 공유해 주세요.</p><ul style="margin:6px 0 0;padding-left:18px;color:var(--ink2)">' +
      bad.map(function (s) { return '<li><b>' + esc(s.label) + '</b>: ' + esc(s.error || '알 수 없는 오류') + '</li>'; }).join('') + '</ul>',
    yes: '확인'
  }, function () {});
}

function addStaffUi() {
  if (S.busy) return;
  var v = function (id) { var el = document.getElementById(id); return el ? el.value : ''; };
  var email = v('st-email'), name = v('st-name');
  S.busy = true; toast('추가하는 중이에요… (파일 공유에 몇 초 걸려요)');
  api('addStaff', email, name).then(function (res) {
    S.busy = false; return loadStaff().then(function () { reportShares((res.reactivated ? '다시 등록했어요.' : '추가했어요.'), res.shares); });
  }).catch(function (err) { S.busy = false; render(); fail(err); });
}
function removeStaffConfirm(email) {
  var x = ((S.staffList && S.staffList.staff) || []).filter(function (s) { return s.email === email; })[0];
  openModal({
    title: '운영진 삭제',
    html: '<p><b>' + esc(x ? x.name : email) + '</b> (' + esc(email) + ')의 접속을 막고 파일 공유를 해제할까요?</p><p class="muted">그 사람이 남긴 수정 기록은 그대로 남아요. 나중에 다시 추가할 수 있어요.</p>',
    yes: '삭제', danger: true
  }, function () {
    api('removeStaff', email).then(function (res) {
      return loadStaff().then(function () {
        var bad = res.shares.filter(function (s) { return !s.ok; });
        if (bad.length) reportShares('삭제했어요. 다만', bad.map(function (s) { return { label: s.label, ok: false, error: s.error }; })); else toast('삭제하고 파일 공유를 해제했어요');
      });
    }).catch(fail);
  });
}
function fixStaffUi(email) {
  toast('공유하는 중이에요…');
  api('fixStaffSharing', email).then(function (res) { return loadStaff().then(function () { reportShares('다시 공유했어요.', res.shares); }); }).catch(fail);
}

/* ===================== 확인 창 ===================== */
function openModal(m, onYes) { S.modal = m; MODAL_FN = onYes; render(); }
function closeModal() { S.modal = null; MODAL_FN = null; render(); }
function modalHtml() {
  var m = S.modal;
  return '<div class="modal-wrap"><div class="dim" data-act="modal-no"></div><div class="modal"><h3>' + esc(m.title) + '</h3>' + m.html +
    (m.need ? '<input type="text" id="modal-text" placeholder="' + esc(m.need) + '" style="width:100%;margin-top:8px">' : '') +
    '<div class="row"><button class="btn" data-act="modal-no">취소</button><button class="btn ' + (m.danger ? 'bad' : 'pri') + '" data-act="modal-yes" id="modal-yes"' + (m.need ? ' disabled' : '') + '>' + esc(m.yes || '확인') + '</button></div></div></div>';
}

/* ===================== 이벤트 ===================== */
document.addEventListener('click', function (ev) {
  var t = ev.target.closest ? ev.target.closest('[data-act]') : null;
  if (!t) return;
  var a = t.getAttribute('data-act'), d = t.dataset;
  if (a === 'none' || t.disabled) return;
  switch (a) {
    case 'nav': S.screen = d.to; S.drawer = null; S.edit = false; if (d.to === 'imp' && !S.imp) S.imp = newImp(); window.scrollTo(0, 0); if (d.to === 'staff') loadStaff(); else render(); break;
    case 'staff-add': addStaffUi(); break;
    case 'staff-del': removeStaffConfirm(d.email); break;
    case 'staff-fix': fixStaffUi(d.email); break;
    case 'staff-reload': loadStaff(); break;
    case 'prog': S.prog = d.id; render(); break;
    case 'sess': S.sid = d.sid; S.screen = 'sess'; window.scrollTo(0, 0); render(); break;
    case 'who': if (d.eid) openWho(d.eid); break;
    case 'close-drawer': S.drawer = null; S.edit = false; render(); break;
    case 'edit': S.edit = true; render(); break;
    case 'edit-cancel': S.edit = false; render(); break;
    case 'edit-save': saveEdit(); break;
    case 'step': toggleStep(d.eid, d.step); break;
    case 'attend': cycleAttend(d.eid); break;
    case 'bulk': bulkAttend(d.v === 'true'); break;
    case 'sf-new': S.sf = { mode: 'new', prog: S.prog !== 'all' ? S.prog : '' }; render(); break;
    case 'sf-edit': S.sf = { mode: 'edit', sid: d.sid }; render(); break;
    case 'sf-close': S.sf = null; render(); break;
    case 'sf-save': saveSessionForm(); break;
    case 'sf-del': deleteSessionConfirm(d.sid); break;
    case 'imp-preview': previewImport(); break;
    case 'imp-commit': commitImport(); break;
    case 'imp-undo': undoImportConfirm(); break;
    case 'modal-no': closeModal(); break;
    case 'modal-yes': { var fn = MODAL_FN; S.modal = null; MODAL_FN = null; render(); if (fn) fn(); break; }
    case 'reload': loadBoot(); break;
  }
});
document.addEventListener('change', function (ev) {
  var el = ev.target;
  if (el.getAttribute && el.getAttribute('data-act') === 'transport') { changeTransport(el.getAttribute('data-eid'), el.value); return; }
  if (el.id === 'imp-file') { onImportFile(el.files && el.files[0]); return; }
  if (el.id === 'imp-ok') { S.imp.ok = el.checked; var b = document.querySelector('[data-act="imp-commit"]'); if (b) b.disabled = !el.checked; return; }
  if (el.id === 'sf-prog') {   // 프로그램을 바꾸면 회차 번호·참가비·정원 기본값을 그 프로그램에 맞춘다
    var pid = el.value, b2 = S.boot;
    var last = sortSessions(b2.sessions.filter(function (x) { return x.program_id === pid; }), b2.today)[0];
    document.getElementById('sf-n').value = nextSessionNumber(b2.sessions, pid);
    document.getElementById('sf-fee').value = last ? last.fee : 50000;
    document.getElementById('sf-cap').value = last ? last.cap : 7;
  }
});
document.addEventListener('input', function (ev) {
  var el = ev.target;
  if (el.id === 'q') { S.q = el.value; var pos = el.selectionStart; render(); var q = document.getElementById('q'); if (q) { q.focus(); q.setSelectionRange(pos, pos); } return; }
  if (el.id === 'modal-text' && S.modal && S.modal.need) { var y = document.getElementById('modal-yes'); if (y) y.disabled = el.value.trim() !== S.modal.need; }
});
document.addEventListener('keydown', function (ev) {
  if (ev.key !== 'Escape') return;
  if (S.modal) closeModal(); else if (S.sf) { S.sf = null; render(); } else if (S.drawer && !S.edit) { S.drawer = null; render(); }
});

/* ===================== 시작 ===================== */
(function init() {
  document.body.insertAdjacentHTML('beforeend', '<div id="toast"></div>');
  var P = window.__PREVIEW;            // 로컬 미리보기(tools/build-preview.js)에서만 있는 값. 실제 앱에는 없다.
  if (P && P.screen) S.screen = P.screen;
  loadBoot().then(function () {
    if (P && P.screen === 'staff') loadStaff();
    if (!P) return;
    if (P.sid) S.sid = P.sid;
    if (P.drawerIdx != null && S.boot.enrollments[P.drawerIdx]) { S.drawer = { eid: S.boot.enrollments[P.drawerIdx].enroll_id }; S.edit = !!P.edit; }
    if (P.sf) S.sf = P.sf;
    if (P.imp) S.imp = P.imp;
    if (P.modal) { S.modal = P.modal; }
    render();
  });
})();
</script>

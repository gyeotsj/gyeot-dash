<script>
/**
 * 개인정보 관리 (파기) 화면. 미리보기는 운영진 누구나, 삭제는 소유자만 한다. 삭제는 되돌릴 수 없다.
 * 서버(previewPurge, purgeExpired)가 대상을 계산한다. 화면은 보여 주고 확인 문구("삭제")를 받아 실행만 요청한다.
 */
var PURGE = { data: null, loading: false, error: '', confirm: '', busy: false, result: null };

function loadPurge() {
  PURGE.loading = true; PURGE.error = '';
  return api('previewPurge').then(function (d) { PURGE.loading = false; PURGE.data = d; if (S.screen === 'purge') render(); })
    .catch(function (err) { PURGE.loading = false; PURGE.error = err.msg; if (S.screen === 'purge') render(); });
}

function purgeHtml() {
  var head = '<div class="top"><div><h1>개인정보 관리</h1><div class="sub">보관 기간이 지난 사람을 찾아 삭제해요. 미동의는 참여한 해의 12/31 이후, 동의는 마지막 참여 종료일 + 3년 이후예요.</div></div><div class="sp"></div>' +
    '<button class="btn" data-act="pg-reload"' + (PURGE.loading ? ' disabled' : '') + '>새로 확인</button></div>';
  if (PURGE.data === null && !PURGE.loading && !PURGE.error) setTimeout(loadPurge, 0);
  if (PURGE.error) return head + '<div class="card card-b"><div class="err">' + esc(PURGE.error) + '</div></div>';
  var d = PURGE.data;
  if (!d) return head + '<div class="card"><div class="empty">불러오는 중…</div></div>';

  if (PURGE.result) {
    var r = PURGE.result;
    return head + '<div class="ban">' + IC.check.replace('<svg', '<svg width="20" height="20"') + '<div class="sp"><b>삭제했어요.</b><br>사람 ' + esc(r.people) + '명 · 참여 기록 ' + esc(r.enrollments) + '건 · 주민번호 ' + esc(r.rrn) + '건 · 만족도 연결 ' + esc(r.satMatches) + '건을 지웠고, 익명 통계 ' + esc(r.statsRows) + '줄을 먼저 남겼어요.' + (r.resumed ? '<br>멈춰 있던 삭제를 이어서 마쳤어요.' : '') + '</div></div>' +
      (r.warn ? '<div class="ban warn">' + IC.warn + '<div class="sp">' + esc(r.warn) + '</div></div>' : '') +
      '<div class="card card-b"><b>이어서 해 주세요</b><ol class="step-list"><li><b>구글폼 응답 시트의 이름도 직접 지워 주세요.</b> 앱은 응답 시트를 고치지 않아요.</li><li>삭제 직전의 백업이 백업 폴더에 있어요. 백업에는 지운 사람의 정보가 남아 있으니 필요 없어지면 소유자가 지워 주세요.</li><li>구글 시트의 버전 기록에는 이전 값이 남을 수 있어요.</li></ol>' +
      '<div class="row" style="margin-top:12px"><button class="btn" data-act="pg-again">목록으로</button></div></div>';
  }

  var reasonChip = function (x) { return x.reason === 'N' ? '<span class="chip bad">미동의 · 연말 지남</span>' : '<span class="chip warn">동의 · 3년 지남</span>'; };
  var rows = function (list, withReason) {
    return list.map(function (x) {
      return '<tr><td class="nw"><b>' + esc(x.name) + '</b></td>' + (withReason ? '<td>' + reasonChip(x) + '</td>' : '') + '<td class="nw">' + esc(x.basis) + '</td><td class="nw">' + esc(x.due) + '</td><td class="nw">' + esc(x.enrollments) + '건</td></tr>';
    }).join('');
  };
  var owner = isOwner();
  var del = d.expired.length
    ? '<div class="card card-b" style="margin-bottom:16px"><div class="row" style="justify-content:space-between"><b>삭제 대상 ' + esc(d.expired.length) + '명</b><span class="chip bad dot">되돌릴 수 없어요</span></div>' +
      '<div class="scroll"><table class="tbl" style="margin-top:8px"><thead><tr><th>이름</th><th>사유</th><th>마지막 참여 종료</th><th>보관 기한</th><th>참여 기록</th></tr></thead><tbody>' + rows(d.expired, true) + '</tbody></table></div>' +
      '<div class="note" style="margin-top:12px">삭제하면 <b>이 사람들의 이름·연락처·참여 기록·주민번호·만족도 연결</b>이 지워져요. 지우기 전에 <b>이름·연락처 없는 익명 통계</b>(인원, 참석, 성별, 연령대, 직업·지역 분포)를 먼저 남기고, 운영 DB를 백업해 둬요.</div>' +
      (owner ? '<div class="row" style="margin-top:12px"><input type="text" id="pg-confirm" placeholder="확인하려면 삭제 라고 입력" value="' + esc(PURGE.confirm) + '" style="width:240px"><button class="btn bad" data-act="pg-run"' + (PURGE.confirm.trim() === '삭제' && !PURGE.busy ? '' : ' disabled') + '>' + (PURGE.busy ? '삭제하는 중…' : '삭제 실행') + '</button></div>'
        : '<div class="note" style="margin-top:12px">삭제는 <b>소유자만</b> 실행할 수 있어요. 대상 목록을 소유자에게 알려 주세요.</div>') + '</div>'
    : '<div class="card card-b" style="margin-bottom:16px"><div class="ban" style="margin:0">' + IC.check.replace('<svg', '<svg width="20" height="20"') + '<div class="sp"><b>지금 삭제할 대상이 없어요.</b> 보관 기간이 지난 사람이 없어요.</div></div></div>';
  var review = d.review.length
    ? '<div class="card card-b" style="margin-bottom:16px"><div class="row"><b>동의 확인 필요 ' + esc(d.review.length) + '명</b><span class="chip warn">자동으로 지우지 않아요</span></div>' +
      '<p class="muted" style="margin:6px 0 8px">개인정보 추가 보유 동의가 "미확인"인데 해당 연도가 지난 사람들이에요. 참여자 화면에서 동의 여부를 확인해 고치면 다음 점검에 반영돼요. (미동의로 고치면 삭제 대상이 돼요)</p>' +
      '<div class="scroll"><table class="tbl"><thead><tr><th>이름</th><th>마지막 참여 종료</th><th>기준 기한</th><th>참여 기록</th></tr></thead><tbody>' + rows(d.review, false) + '</tbody></table></div></div>' : '';
  return head +
    (d.pending ? '<div class="ban warn">' + IC.warn + '<div class="sp"><b>이전 삭제가 중간에 멈춘 기록이 있어요.</b> 삭제 실행을 다시 누르면 이어서 마쳐요 (익명 통계는 두 번 더하지 않아요).</div></div>' : '') +
    '<div class="muted" style="margin-bottom:12px">오늘 ' + esc(d.today) + ' · 동의자 보관 ' + esc(d.years) + '년 · 진행 중이거나 곧 시작하는 회차에 참여한 사람은 대상이 아니에요 (' + esc(d.summary.active) + '명)' + (d.noBasis ? ' · 기준일을 알 수 없어 건너뛴 ' + esc(d.noBasis) + '명' : '') + '</div>' + del + review;
}

function purgeRun() {
  if (PURGE.busy || PURGE.confirm.trim() !== '삭제' || !isOwner()) return;
  var n = PURGE.data ? PURGE.data.expired.length : 0;
  openModal({ title: '개인정보 삭제', html: '<p><b>' + esc(n) + '명</b>의 이름·연락처·참여 기록·주민번호를 <b>영구 삭제</b>해요. 되돌릴 수 없어요. 삭제 직전의 운영 DB는 백업해 둬요.</p><p>계속할까요?</p>', yes: '삭제', danger: true }, function () {
    PURGE.busy = true; render();
    api('purgeExpired', PURGE.confirm.trim()).then(function (r) { PURGE.busy = false; PURGE.result = r; PURGE.confirm = ''; return loadBoot().then(function () { return loadPurge(); }); })
      .catch(function (err) { PURGE.busy = false; PURGE.confirm = ''; render(); fail(err); loadBoot(); loadPurge(); });
  });
}

document.addEventListener('click', function (ev) {
  var t = ev.target.closest ? ev.target.closest('[data-act]') : null;
  if (!t || t.disabled) return;
  var a = t.getAttribute('data-act');
  if (a === 'pg-reload') { PURGE.result = null; PURGE.data = null; loadPurge(); render(); }
  else if (a === 'pg-again') { PURGE.result = null; render(); }
  else if (a === 'pg-run') purgeRun();
});
document.addEventListener('input', function (ev) {
  var el = ev.target;
  if (el && el.id === 'pg-confirm') { PURGE.confirm = el.value; var b = document.querySelector('[data-act="pg-run"]'); if (b) b.disabled = PURGE.confirm.trim() !== '삭제' || PURGE.busy; }
});
</script>

<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<?!= include('Style') ?>
</head>
<body>
<? if (kind === 'app') { ?>
  <div id="root"><div class="loading">불러오는 중…</div></div>
  <script>var APP_VERSION = <?!= JSON.stringify(String(d.version)) ?>;</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <?!= include('Logic') ?>
  <?!= include('Client') ?>
<? } else { ?>
  <div class="center">
    <div class="card deny">
      <div class="icon">!</div>
      <? if (d.reason === 'login') { ?>
        <h1>구글 로그인이 필요합니다</h1>
        <p>구글 계정으로 로그인한 뒤 다시 접속해 주세요.</p>
      <? } else if (d.reason === 'notsetup') { ?>
        <h1>아직 초기 설정 전입니다</h1>
        <p>소유자가 먼저 설정(setup)을 실행해야 합니다.</p>
      <? } else if (d.reason === 'noaccess') { ?>
        <h1>데이터에 접근할 권한이 없습니다</h1>
        <p>소유자에게 운영 DB 공유를 요청해 주세요.</p>
      <? } else { ?>
        <h1>등록된 운영진이 아닙니다</h1>
        <p>소유자에게 운영진 추가를 요청해 주세요.</p>
      <? } ?>
      <? if (d.email) { ?><div class="who">접속 계정: <?= d.email ?></div><? } ?>
    </div>
  </div>
<? } ?>
</body>
</html>
